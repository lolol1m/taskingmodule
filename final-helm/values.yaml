postgres:
  serviceName: postgres
  image: postgres:15.6
  imagePullPolicy: IfNotPresent
  containerName: xbi-postgres-trial

  storage:
    size: 1Gi

  port: 5432
  env:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: password
    POSTGRES_DB: XBI_TASKING_3

