{{- if .Values.proxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.proxy.serviceName }}-config
data:
  default.conf: |
    server {
        listen {{ .Values.proxy.containerPort }} ssl;
        server_name {{ .Values.proxy.host }};

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;

        proxy_buffer_size   128k;
        proxy_buffers       4 256k;
        proxy_busy_buffers_size 256k;

        location = /api {
            return 308 $uri/;
        }

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://{{ .Values.proxy.backendService }}:{{ .Values.proxy.backendPort }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port {{ .Values.proxy.containerPort }};
        }

        location / {
            proxy_pass http://{{ .Values.proxy.frontendService }}:{{ .Values.proxy.frontendPort }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port {{ .Values.proxy.containerPort }};
        }
    }
{{- end }}
