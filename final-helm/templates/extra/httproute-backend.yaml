{{- if and .Values.gateway.enabled .Values.backend.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
  hostnames:
{{- range .Values.backend.gateway.hostnames }}
    - {{ . | quote }}
{{- end }}
  rules:
    - matches:
        - path:
            type: {{ .Values.backend.gateway.pathType }}
            value: {{ .Values.backend.gateway.path }}
      backendRefs:
        - name: backend
          port: {{ .Values.backend.service.port }}
{{- end }}