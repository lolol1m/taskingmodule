apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Values.frontend.serviceName }}
  name: {{ .Values.frontend.serviceName }}
spec:
  type: ClusterIP
  ports:
    - name: "4173"
      port: {{ .Values.ingress.frontend.port }}
      targetPort: {{ .Values.frontend.targetPort }}
      protocol: TCP
  selector:
    app: {{ .Values.frontend.serviceName }}
