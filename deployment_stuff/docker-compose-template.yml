version: "1.0"

services:

  frontend:
    build: ./xbi_tasking_frontend
    # Use image instead of build once you have image loaded
    # image: taskingmodule-frontend
    container_name: xbi-frontend
    depends_on:
      - backend
    environment:
      VITE_MUI_X_LICENSE_KEY: e0d9bb8070ce0054c9d9ecb6e82cb58fTz0wLEU9MzI0NzIxNDQwMDAwMDAsUz1wcmVtaXVtLExNPXBlcnBldHVhbCxLVj0y
      VITE_BACKEND_URL: http://localhost:5000
      VITE_KEYCLOAK_URL: https://localhost:8443
      # VITE_KEYCLOAK_URL: http://keycloak:8080
      VITE_KEYCLOAK_REALM: xbi-tasking
      VITE_CLIENT_ID: xbi-tasking-frontend
      VITE_ROLES_CLIENT_ID: xbi-tasking-backend
    ports:
      - "5173:5173"

  backend:
    build: ./xbi_tasking_backend
    # Use image instead of build once you have image loaded
    # image: taskingmodule-backend
    container_name: xbi-backend
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      # FRONTEND_URL: https://eh_sike:5173 #TODO: Does not work with IP as keycloak auth goes to 'localhost' on non-host machine   
      FRONTEND_URL: https://localhost:5173   
      # Database
      DB_HOST: postgres
      DB_NAME: XBI_TASKING_3
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      AUTO_INIT_DB: true

      # Keycloak 
      KEYCLOAK_PUBLIC_URL: https://localhost:8443
      KEYCLOAK_INTERNAL_URL: https://keycloak:8443
      KEYCLOAK_REALM: xbi-tasking
      #insert secrets for your custom kc image
      KEYCLOAK_CLIENT_ID: xbi-tasking-backend
      KEYCLOAK_CLIENT_SECRET: 
      KEYCLOAK_ADMIN_CLIENT_ID: xbi-tasking-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: 
      KEYCLOAK_ENABLED: "true"
      ALLOWED_CLIENT_IDS: "xbi-tasking-frontend, xbi-tasking-backend, xbi-tasking-admin"

    ports:
      - "5000:5000"


  postgres:
    image: postgres:15.6
    container_name: xbi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: XBI_TASKING_3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres "]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      # - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"


  keycloak:
    build: ./deployment_stuff/xbi-keycloak/

    # image: xbi-keycloak:2.7
    # See dockerfile and adjust where to store certs as you like, make sure its the correct fp for youur image
    container_name: xbi-keycloak
    # command: 
    # - start-dev
    # - --import-realm
    # - --hostname=localhost
    # - --hostname-strict=false
    # - --https-certificate-file=/opt/keycloak/conf/keycloak.crt
    # - --https-certificate-key-file=/opt/keycloak/conf/keycloak.key
    environment:
      # KEYCLOAK_ADMIN: admin
      # KEYCLOAK_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

    ports:
      # - "8080:8080"
      - "8443:8443"
    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  pgdata:
  keycloak_data:
